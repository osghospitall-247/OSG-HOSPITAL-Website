<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1FD1C9" />
      <stop offset="100%" stop-color="#16A6A0" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A6A0" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Emblem Icon: Medical Shield + Heartbeat Cross -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Rounded Medical Emblem -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tealGrad)" />
    <!-- Medical Plus Symbol inside -->
    <path d="M 32 16 L 32 48 M 16 32 L 48 32" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <!-- Pulse Line across center -->
    <path d="M 18 32 L 25 32 L 29 22 L 35 42 L 39 32 L 46 32" fill="none" stroke="#0B2545" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Caring Hand Arc -->
    <path d="M 12 46 C 22 56 42 56 52 46" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Typography -->
  <g transform="translate(82, 22)">
    <!-- Primary Name -->
    <text x="0" y="22" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      OSG <tspan fill="#1FD1C9" font-weight="700">HOSPITAL</tspan>
    </text>
    <!-- Subtitle / Tagline -->
    <text x="1" y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#DCEEFF">
      HEALING TOUCH &bull; BENGALURU
    </text>
  </g>
</svg>